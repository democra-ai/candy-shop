name = "candy-shop-api"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Workers.dev default domain
workers_dev = true

# Pin to an empty assets dir; without this Wrangler 4.82 auto-detects
# the SPA's `../dist/` parent and tries to upload all of node_modules
# as static assets, blowing up on 25 MiB-per-file limits.
[assets]
directory = "/Users/tao.shen/democra-ai/candy-shop/worker/.empty-assets"

# D1 binding — the database id is filled in after
# `wrangler d1 create candy-shop-db`.
[[d1_databases]]
binding = "DB"
database_name = "candy-shop-db"
database_id = "cad9f8ca-9ea7-4f17-92c4-e015ed58142e"
migrations_dir = "migrations"

# KV for session cookies (guest + OAuth sessions)
[[kv_namespaces]]
binding = "SESSIONS"
id = "70babb51799549da94b179a457c43bf8"

# KV for daily Workers AI budget counter (hard-caps free tier)
[[kv_namespaces]]
binding = "AI_BUDGET"
id = "a853343d47534ca48349ba37b959950e"

# Workers AI binding — inference on Cloudflare's hosted models.
# The Worker hard-caps daily Neurons to stay inside the free allocation
# (see POST /api/ai/chat). Free tier = 10,000 Neurons/day.
[ai]
binding = "AI"

# Non-secret env vars. Secrets (Stripe keys, webhook secret) are set via
#   wrangler secret put STRIPE_SECRET_KEY
#   wrangler secret put STRIPE_WEBHOOK_SECRET
[vars]
# Leave empty by default; checkout route falls back to request origin.
PUBLIC_APP_ORIGIN = ""

[observability]
enabled = true
